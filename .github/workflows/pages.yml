name: build-data-and-deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/bus_violations/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data pipeline
        run: python -m pip install -e .

      - name: Build exact dashboard data
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          touch _site/.nojekyll
          python -m bus_violations.web_export --output _site/data

      - name: Enforce GitHub Pages size limit
        run: |
          site_bytes=$(du -sb _site | cut -f1)
          echo "Published site size: $site_bytes bytes"
          if [ "$site_bytes" -gt 950000000 ]; then
            echo "Site exceeds the safe 950 MB deployment ceiling."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
