name: deploy-dashboard-pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  repository_dispatch:
    types: [dashboard-data-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Check out dashboard
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Check out generated data
        uses: actions/checkout@v4
        with:
          ref: dashboard-data
          path: dashboard-data

      - name: Assemble site
        run: |
          test -s dashboard-data/manifest.json
          test -s dashboard-data/trend_summary.parquet
          mkdir -p _site/data
          cp -R source/docs/. _site/
          rsync -a --exclude=.git dashboard-data/ _site/data/
          touch _site/.nojekyll

      - name: Enforce GitHub Pages size limit
        run: |
          site_bytes=$(du -sb _site | cut -f1)
          echo "Published site size: $site_bytes bytes"
          if [ "$site_bytes" -gt 950000000 ]; then
            echo "Site exceeds the safe 950 MB deployment ceiling."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
